name: Setup Android Build
description: JDK 21(temurin)과 Gradle을 설정하고 Android SDK 라이선스를 수락한다

runs:
  using: composite
  steps:
    - name: Set up JDK 21
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: "21"

    # Gradle User Home 캐시를 직접 관리한다. 캐시 저장 시 modules-2.lock·gc.properties 같은
    # 휘발성 파일을 제외하므로, 워크플로마다 수동으로 지울 필요가 없다.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

    # ubuntu-latest 에는 Android SDK 가 있고 ANDROID_HOME 이 설정돼 있다.
    # 라이선스만 수락해 두면 AGP 가 compileSdk 플랫폼을 자동으로 내려받는다.
    # `yes` 는 sdkmanager 가 끝나면 SIGPIPE 로 죽으므로 process substitution 으로 받아 pipefail 오탐을 피한다
    - name: Accept Android SDK licenses
      shell: bash
      run: |
        sdkmanager="${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager"
        if [ -x "$sdkmanager" ]; then
          "$sdkmanager" --licenses < <(yes) > /dev/null || echo "::warning::sdkmanager --licenses failed; AGP may not download the platform"
        else
          echo "::warning::sdkmanager not found at $sdkmanager; skipping license acceptance"
        fi
