name: test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  # detect-code-changes 가 PR 파일 목록 API 를 부른다. 비공개 저장소에서는 이 권한이 없으면 403 이 나 문서만 바꾼 PR 도 전체 빌드한다
  pull-requests: read

concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # unit-test 는 필수 체크라 paths-ignore 대신 스텝만 건너뛴다
      - id: changes
        uses: ./.github/actions/detect-code-changes

      - uses: ./.github/actions/setup-android-build
        if: steps.changes.outputs.code == 'true'

      # testStarter: 유닛 테스트(Android testDebugUnitTest, JVM test, Konsist, build-logic ModuleRulesTest),
      # 계측 테스트 컴파일(assembleDebugAndroidTest, 에뮬레이터 없음), detekt, ktlint 를 묶은 집계 task다.
      # release 빌드와 스크린샷 기록은 하지 않는다(build-release, ui-diff workflow 가 맡는다).
      # --continue: 하나가 깨져도 나머지를 끝까지 돌려 리포트를 남긴다
      - name: Test
        if: steps.changes.outputs.code == 'true'
        run: ./gradlew testStarter --continue

      # 실패해도 결과를 남긴다. 포크 PR 은 토큰이 읽기 전용이라 체크를 못 쓰므로 이 단계 실패는 무시한다
      - name: Publish test report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2.7.0
        continue-on-error: true
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: Unit Test Results
          path: '**/build/test-results/**/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 7
