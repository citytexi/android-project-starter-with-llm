name: build-debug

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  # detect-code-changes 가 PR 파일 목록 API 를 부른다. 비공개 저장소에서는 이 권한이 없으면 403 이 나 문서만 바꾼 PR 도 전체 빌드한다
  pull-requests: read

concurrency:
  group: build-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 필수 체크로 쓸 수 있게 paths-ignore 대신 스텝만 건너뛴다 (workflow_dispatch 는 항상 빌드한다)
      - id: changes
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/detect-code-changes

      - uses: ./.github/actions/setup-android-build
        if: steps.changes.outputs.code != 'false'

      - name: Assemble debug
        if: steps.changes.outputs.code != 'false'
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.changes.outputs.code != 'false'
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
