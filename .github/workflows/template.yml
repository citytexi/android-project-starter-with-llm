name: template

# 스펙은 main 을 기준으로 하지만 이 레포의 기본 브랜치는 현재 develop 이다.
# 그래서 두 브랜치를 대상으로 한 PR 에서 모두 돌린다.
on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # generate.py 가 생성물에 git init + 첫 커밋을 하므로 신원이 필요하다.
      # CLI 테스트가 이 설정이 있는 환경에서 git 경로를 실제로 탄다
      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generator tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: ui-diff script tests
        run: python3 -m unittest discover -s variants/ci/ui-diff/.github/scripts/ui_diff -p 'test_*.py'

      # 버전 고정 + sha256 검증은 로컬 액션 한 곳에서 관리한다
      - uses: ./.github/actions/install-actionlint

      # 변형 workflow 의 로컬 composite action 참조(./.github/actions/...)는 생성된 프로젝트 안에서만 풀린다.
      # actionlint 는 workflow 파일 단위 검사라 이를 문제 삼지 않으므로 변형 원본도 여기서 검사하고,
      # 생성물 검사는 generate 잡에서 한 번 더 한다.
      - name: actionlint (this repo and variants)
        run: |
          actionlint .github/workflows/*.yml
          actionlint variants/ci/*/.github/workflows/*.yml

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        nav: [ nav2, nav3 ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # generate.py 가 생성물에 git init + 첫 커밋을 하므로 신원이 필요하다
      - name: Set git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # 변형의 composite action 은 이 레포의 .github/actions 에 없으므로 같은 단계를 인라인한다
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # ubuntu-latest 에는 Android SDK 가 있고 ANDROID_HOME 이 설정돼 있다.
      # 라이선스만 수락해 두면 AGP 가 compileSdk 37 플랫폼을 자동으로 내려받는다.
      - name: Accept Android SDK licenses
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$sdkmanager" ]; then
            "$sdkmanager" --licenses < <(yes) > /dev/null || echo "::warning::sdkmanager --licenses failed; AGP may not download platform 37"
          else
            echo "::warning::sdkmanager not found at $sdkmanager; skipping license acceptance"
          fi

      - name: Generate project
        run: python3 scripts/generate.py --prd scripts/fixtures/dev-${{ matrix.nav }}.prd.md

      - name: Verify generated project
        run: python3 scripts/verify.py build/dev/${{ matrix.nav }}

      # 버전 고정 + sha256 검증은 로컬 액션 한 곳에서 관리한다
      - uses: ./.github/actions/install-actionlint

      - name: actionlint (generated workflows)
        working-directory: build/dev/${{ matrix.nav }}
        run: actionlint

      - name: Upload test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: reports-${{ matrix.nav }}
          path: build/dev/${{ matrix.nav }}/**/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
