name: 기능 이슈
description: 템플릿이나 생성 스크립트에 새 기능 또는 요청 사항을 제안합니다.
title: "[Feature]: "
labels: ["기능"]
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 또는 요청 사항에 대해 설명해주세요.
  - type: textarea
    id: feature-description
    attributes:
      label: 어떤 기능인가요?
      description: 제안하는 기능에 대해 구체적으로 설명해주세요.
      placeholder: 기능에 대해서 설명해주세요!
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 변경 범위
      description: 어디를 바꿔야 하나요? (여러 개 선택 가능)
      multiple: true
      options:
        - template/
        - variants/navigation/
        - variants/ci/
        - scripts/
        - PRD 키
        - 문서
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 참고 사항
      description: 관련 링크, 참고 문서 등.
    validations:
      required: false
