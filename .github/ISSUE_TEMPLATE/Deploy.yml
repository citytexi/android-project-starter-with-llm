name: 배포 이슈
description: 스타터의 릴리스(태그, 릴리스 노트) 작업입니다.
title: "[Deploy]: "
labels: ["배포"]
body:
  - type: markdown
    attributes:
      value: |
        릴리스 관련 작업을 위한 이슈입니다.
  - type: dropdown
    id: deploy-type
    attributes:
      label: 작업 종류
      description: 어떤 릴리스 작업인가요?
      options:
        - 신규 릴리스
        - 핫픽스 릴리스
        - 릴리스 절차/설정 변경
        - 롤백
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 작업 내용
      description: 어떤 릴리스 작업을 하는지 구체적으로 작성해주세요.
      placeholder: 릴리스 작업에 대해 설명해주세요!
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 릴리스 정보
      description: 대상 버전과 포함되는 변경을 작성해주세요.
      value: |
        - 버전 (태그):
        - 기준 브랜치:
        - 주요 변경:
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 릴리스 전/후 확인해야 할 항목을 작성해주세요.
      value: |
        - [ ] template.yml CI 통과 (nav2 / nav3)
        - [ ] AGENTS.md / PRD.template.md 최신화
        - [ ] 릴리스 노트 작성
    validations:
      required: false
