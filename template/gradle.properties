# Parallel workers plus the Kotlin daemon need more than the default heap.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official

# Project values. scripts/generate.py rewrites these two lines from the PRD.
# minSdk is read by starter.android.application / starter.android.library.
starter.minSdk=26
# Read by :core:network into BuildConfig.BASE_URL.
starter.baseUrl=https://example.invalid/
